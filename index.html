<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIMIG 422 (2026)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --navy: #112240;
            --navy-hover: #1a3366;
            --navy-light: #e6eaf2;
            --white: #ffffff;
            --bg: #f7f8fc;
            --card: #ffffff;
            --border: #dce1ed;
            --text: #1e293b;
            --muted: #64748b;
            --green: #0d9460;
            --green-hover: #0b7d52;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--white);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 10% 90%, rgba(17,34,64,0.025) 0%, transparent 55%),
                radial-gradient(ellipse at 90% 10%, rgba(17,34,64,0.025) 0%, transparent 55%);
            pointer-events: none;
            z-index: 0;
        }

        .home {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 40px 24px;
            max-width: 620px;
            width: 100%;
        }

        .icon-box {
            width: 96px;
            height: 96px;
            background: var(--navy);
            border-radius: 24px;
            display: grid;
            place-items: center;
            margin-bottom: 32px;
            box-shadow: 0 8px 30px rgba(17,34,64,0.2);
            animation: floatIn .6s ease;
        }

        .icon-box i {
            font-size: 42px;
            color: var(--white);
        }

        @keyframes floatIn {
            from { opacity: 0; transform: translateY(-20px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        h1 {
            font-size: 38px;
            font-weight: 900;
            color: var(--navy);
            line-height: 1.1;
            margin-bottom: 4px;
            animation: fadeUp .5s ease .1s both;
        }

        .subtitle {
            font-size: 20px;
            font-weight: 300;
            color: var(--muted);
            margin-bottom: 12px;
            animation: fadeUp .5s ease .2s both;
        }

        .dept {
            font-size: 14px;
            font-weight: 600;
            color: var(--navy);
            opacity: .5;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 48px;
            animation: fadeUp .5s ease .3s both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .cards {
            display: flex;
            gap: 20px;
            width: 100%;
            animation: fadeUp .5s ease .4s both;
        }

        .card-link {
            text-decoration: none;
            flex: 1;
            display: flex;
        }

        .card {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 18px;
            padding: 36px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            width: 100%;
            min-height: 220px;
            transition: all .25s ease;
            cursor: pointer;
        }

        .card:hover {
            border-color: var(--navy);
            box-shadow: 0 8px 30px rgba(17,34,64,0.12);
            transform: translateY(-4px);
        }

        .card-icon {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            display: grid;
            place-items: center;
        }

        .card-icon.ospe {
            background: var(--navy);
        }

        .card-icon.ospe i {
            font-size: 28px;
            color: var(--white);
        }

        .card-icon.endblock {
            background: var(--green);
        }

        .card-icon.endblock i {
            font-size: 28px;
            color: var(--white);
        }

        .card-title {
            font-size: 20px;
            font-weight: 900;
            color: var(--navy);
        }

        .card-desc {
            font-size: 13px;
            font-weight: 400;
            color: var(--muted);
            line-height: 1.5;
        }

        .card:hover .card-icon.ospe {
            box-shadow: 0 4px 16px rgba(17,34,64,0.3);
        }

        .card:hover .card-icon.endblock {
            box-shadow: 0 4px 16px rgba(13,148,96,0.3);
        }

        .footer {
            margin-top: 56px;
            font-size: 12px;
            color: var(--border);
            font-weight: 600;
            letter-spacing: 1px;
            animation: fadeUp .5s ease .5s both;
        }

        @media (max-width: 540px) {
            .cards {
                flex-direction: column;
            }
            h1 { font-size: 30px; }
            .subtitle { font-size: 17px; }
            .card { padding: 28px 20px; min-height: 180px; }
        }
    </style>
</head>
<body>

    <div class="home">
        <div class="icon-box">
            <i class="fas fa-x-ray"></i>
        </div>

        <h1>MIMIG 422</h1>
        <div class="subtitle">2026</div>
        <div class="dept">Medical Imaging</div>

        <div class="cards">
            <a class="card-link" href="https://abdulrahmankaltham.github.io/MIMIG422/OSPE">
                <div class="card">
                    <div class="card-icon ospe">
                        <i class="fas fa-clipboard-question"></i>
                    </div>
                    <div class="card-title">OSPE</div>
                    <div class="card-desc">Objective Structured Practical Examination</div>
                </div>
            </a>

            <a class="card-link" href="https://abdulrahmankaltham.github.io/MIMIG422/End-Block">
                <div class="card">
                    <div class="card-icon endblock">
                        <i class="fas fa-file-circle-check"></i>
                    </div>
                    <div class="card-title">End Block</div>
                    <div class="card-desc">End of Block Examination</div>
                </div>
            </a>
        </div>

        <div class="footer">MIMIG 422</div>
    </div>

</body>
</html>
