<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIMG 422 End Block</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --navy: #112240;
            --navy-hover: #1a3366;
            --navy-light: #e6eaf2;
            --white: #ffffff;
            --bg: #f7f8fc;
            --card: #ffffff;
            --border: #dce1ed;
            --text: #1e293b;
            --muted: #64748b;
            --green: #0d9460;
            --green-bg: #ecfdf5;
            --red: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--white);
            color: var(--text);
            min-height: 100vh;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 10% 90%, rgba(17,34,64,0.02) 0%, transparent 55%),
                radial-gradient(ellipse at 90% 10%, rgba(17,34,64,0.02) 0%, transparent 55%);
            pointer-events: none;
            z-index: 0;
        }
        .top-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 60px;
            background: var(--navy);
            color: var(--white);
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 200;
            box-shadow: 0 3px 18px rgba(17,34,64,0.18);
        }
        .top-bar.visible { display: flex; }
        .top-bar .brand { font-size: 15px; font-weight: 700; white-space: nowrap; }
        .pill {
            background: rgba(255,255,255,0.12);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .pill i { font-size: 12px; }
        .progress-track {
            position: fixed;
            top: 60px; left: 0; right: 0;
            height: 4px;
            background: var(--navy-light);
            z-index: 199;
            display: none;
        }
        .progress-track.visible { display: block; }
        .progress-fill {
            height: 100%;
            background: var(--navy);
            transition: width .45s ease;
            width: 0;
        }
        .container {
            max-width: 880px;
            margin: 0 auto;
            padding: 24px 18px 60px;
            position: relative;
            z-index: 1;
        }
        .welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 108px);
            text-align: center;
            padding-top: 40px;
        }
        .welcome .icon-box {
            width: 88px; height: 88px;
            background: var(--navy);
            border-radius: 22px;
            display: grid; place-items: center;
            margin-bottom: 28px;
            box-shadow: 0 8px 30px rgba(17,34,64,0.2);
        }
        .welcome .icon-box i { font-size: 38px; color: var(--white); }
        .welcome h1 { font-size: 32px; font-weight: 900; color: var(--navy); }
        .welcome .subtitle { font-size: 20px; font-weight: 300; color: var(--muted); margin-top: 4px; }
        .welcome .desc { color: var(--muted); font-size: 14px; line-height: 1.9; max-width: 520px; margin-top: 16px; margin-bottom: 28px; }
        .btn {
            border: none;
            padding: 13px 36px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            border-radius: 12px;
            cursor: pointer;
            transition: all .2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn:active { transform: scale(.97); }
        .btn-navy { background: var(--navy); color: var(--white); }
        .btn-navy:hover { background: var(--navy-hover); box-shadow: 0 6px 20px rgba(17,34,64,0.28); }
        .btn-green { background: var(--green); color: var(--white); }
        .btn-green:hover { background: #0b7d52; box-shadow: 0 6px 20px rgba(13,148,96,0.25); }
        .btn-red { background: var(--red); color: var(--white); }
        .btn-red:hover { background: #dc2626; }
        .btn-outline {
            background: transparent;
            color: var(--navy);
            border: 2px solid var(--border);
        }
        .btn-outline:hover:not(:disabled) {
            border-color: var(--navy);
            background: var(--navy-light);
        }
        .btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none !important; }
        .btn-sm { padding: 8px 18px; font-size: 13px; }
        .welcome-btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

        /* ===== Selection Screen ===== */
        .selection-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
            animation: slideUp .4s ease;
        }
        .selection-screen.visible { display: flex; }
        .selection-screen h2 {
            font-size: 24px; font-weight: 900; color: var(--navy); margin-bottom: 6px;
        }
        .selection-screen .sub {
            font-size: 14px; color: var(--muted); margin-bottom: 24px;
        }
        .select-group {
            width: 100%; max-width: 600px; margin-bottom: 28px; text-align: center;
        }
        .select-group label {
            display: block; font-size: 15px; font-weight: 700; color: var(--navy); margin-bottom: 12px;
        }
        .chip-grid {
            display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
        }
        .chip-btn {
            position: relative; cursor: pointer;
        }
        .chip-btn input {
            position: absolute; opacity: 0; width: 0; height: 0;
        }
        .chip-btn span {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 10px 20px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-weight: 600; font-size: 14px; color: var(--muted);
            transition: all .15s; user-select: none; background: var(--bg);
        }
        .chip-btn:hover span { border-color: var(--navy); color: var(--navy); }
        .chip-btn input:checked + span {
            background: var(--navy); border-color: var(--navy); color: var(--white);
        }
        .selection-btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }

        /* ===== Question Card ===== */
        .q-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            margin-top: 16px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.05);
            animation: slideUp .4s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .q-body { padding: 28px 24px; }
        .q-body .lecture-tag {
            display: inline-block;
            background: var(--navy-light);
            color: var(--navy);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .q-item {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px 20px;
            margin-bottom: 12px;
            transition: border-color .3s, background .3s;
        }
        .q-item:last-child { margin-bottom: 0; }
        .q-item .q-text { font-size: 16px; font-weight: 600; color: var(--text); line-height: 1.6; }
        .q-item .q-img {
            margin-top: 12px;
            text-align: center;
        }
        .q-item .q-img img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .q-item .a-text {
            display: none;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1.5px dashed var(--border);
            font-size: 15px;
            font-weight: 700;
            color: var(--green);
            animation: fadeAnswer .35s ease;
        }
        .q-item.revealed .a-text { display: block; }
        .q-item.revealed { border-color: var(--green); background: var(--green-bg); }
        @keyframes fadeAnswer {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 24px 22px;
            flex-wrap: wrap;
            border-top: 1px solid var(--border);
        }

        /* ===== Flashcards ===== */
        .fc-container {
            perspective: 1000px;
            width: 100%;
            max-width: 600px;
            height: 400px;
            margin: 20px auto 10px;
        }
        .fc-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .fc-inner.flipped {
            transform: rotateY(180deg);
        }
        .fc-front, .fc-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid var(--border);
        }
        .fc-front {
            background: var(--card);
            color: var(--navy);
            font-size: 20px;
            font-weight: 700;
            line-height: 1.5;
        }
        .fc-front .fc-label {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .fc-back {
            background: var(--navy);
            color: var(--white);
            transform: rotateY(180deg);
            font-size: 18px;
            font-weight: 600;
            line-height: 1.5;
        }
        .fc-back .fc-label {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 12px;
            font-weight: 700;
            color: rgba(255,255,255,0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .fc-back .fc-btns {
            position: absolute;
            bottom: 25px;
            display: flex;
            gap: 15px;
        }
        .fc-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .fc-counter {
            font-size: 16px;
            font-weight: 700;
            color: var(--navy);
            min-width: 70px;
            text-align: center;
        }

        /* ===== Done ===== */
        .done {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 108px);
            text-align: center;
            padding-top: 40px;
        }
        .done.visible { display: flex; }
        .done .check-circle {
            width: 88px; height: 88px;
            background: var(--green);
            border-radius: 50%;
            display: grid; place-items: center;
            margin-bottom: 24px;
            animation: popIn .5s cubic-bezier(.17,.67,.35,1.3);
        }
        @keyframes popIn {
            from { transform: scale(0); } to { transform: scale(1); }
        }
        .done .check-circle i { font-size: 42px; color: var(--white); }
        .done h2 { font-size: 28px; font-weight: 900; color: var(--navy); }
        .done .sub-done { font-size: 17px; color: var(--muted); margin-top: 4px; margin-bottom: 28px; }
        .btn-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

        @media (max-width: 640px) {
            .top-bar { padding: 0 12px; }
            .top-bar .brand { font-size: 12px; }
            .pill { font-size: 11px; padding: 4px 10px; }
            .welcome h1 { font-size: 26px; }
            .q-body { padding: 20px 16px; }
            .actions { padding: 14px; gap: 8px; }
            .btn { padding: 11px 20px; font-size: 13px; }
            .chip-btn span { padding: 8px 14px; font-size: 13px; }
            .fc-container { height: 360px; }
            .fc-front { font-size: 18px; }
            .fc-back { font-size: 16px; }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    </style>
</head>
<body>

    <header class="top-bar" id="topBar">
        <span class="brand">MIMG 422</span>
        <div class="pill">
            <i class="fas fa-list-ol"></i>
            <span id="remainCount">Remaining: 0</span>
        </div>
    </header>

    <div class="progress-track" id="progressTrack">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="container">

        <!-- ===== Welcome ===== -->
        <section class="welcome" id="welcomeScreen">
            <div class="icon-box"><i class="fas fa-book-medical"></i></div>
            <h1>MIMG 422 End Block</h1>
            <div class="subtitle">Past Questions & Flashcards</div>
            <p class="desc">
                Practice past questions or review high-yield flashcards organized by lecture.
            </p>
            <div class="welcome-btns">
                <button class="btn btn-navy" onclick="openSelection('exam')">
                    <i class="fas fa-pen-to-square"></i> Past Questions
                </button>
                <button class="btn btn-green" onclick="openSelection('flash')">
                    <i class="fas fa-clone"></i> Flashcards
                </button>
            </div>
        </section>

        <!-- ===== Selection Screen ===== -->
        <section class="selection-screen" id="selectionScreen">
            <h2 id="selectionTitle">Customize Your Practice</h2>
            <p class="sub" id="selectionSub">Choose patch and lecture, or go random</p>

            <div class="select-group" id="patchGroup">
                <label><i class="fas fa-calendar-alt" style="margin-right:6px"></i> Select Patch</label>
                <div class="chip-grid" id="patchGrid"></div>
            </div>

            <div class="select-group">
                <label><i class="fas fa-book" style="margin-right:6px"></i> Select Lecture</label>
                <div class="chip-grid" id="lectureGrid"></div>
            </div>

            <div class="selection-btns">
                <button class="btn btn-outline" onclick="backToWelcome()">
                    <i class="fas fa-arrow-left"></i> Back
                </button>
                <button class="btn btn-navy" id="startExamBtn" onclick="startPractice()" style="display:none">
                    <i class="fas fa-play"></i> Start
                </button>
                <button class="btn btn-green" id="startFlashBtn" onclick="startFlashcards()" style="display:none">
                    <i class="fas fa-play"></i> Start
                </button>
            </div>
        </section>

        <!-- ===== Exam ===== -->
        <main id="examScreen"></main>

        <!-- ===== Flashcards ===== -->
        <section id="flashScreen" style="display:none; padding-top: 20px;">
            <div class="fc-container">
                <div class="fc-inner" id="flashInner">
                    <div class="fc-front">
                        <span class="fc-label">Question</span>
                        <span id="flashFrontText"></span>
                    </div>
                    <div class="fc-back">
                        <span class="fc-label">Answer</span>
                        <span id="flashBackText"></span>
                        <div class="fc-btns" id="fcBtns" style="display:none;">
                            <button class="btn btn-green btn-sm" onclick="markFlashcard(true)"><i class="fas fa-check"></i> Correct</button>
                            <button class="btn btn-red btn-sm" onclick="markFlashcard(false)"><i class="fas fa-times"></i> Incorrect</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="fc-controls">
                <button class="btn btn-outline btn-sm" onclick="prevFlashcard()"><i class="fas fa-arrow-left"></i> Prev</button>
                <button class="btn btn-navy btn-sm" onclick="flipCard()"><i class="fas fa-sync-alt"></i> Flip</button>
                <div class="fc-counter" id="flashCounter">1 / 1</div>
                <button class="btn btn-outline btn-sm" onclick="nextFlashcard()">Next <i class="fas fa-arrow-right"></i></button>
                <button class="btn btn-navy btn-sm" onclick="shuffleFlashcards()"><i class="fas fa-shuffle"></i> Shuffle</button>
            </div>
            <div style="text-align: center; margin-top: 20px;">
                <button class="btn btn-outline btn-sm" onclick="backToWelcomeFromFlash()"><i class="fas fa-home"></i> Main Menu</button>
            </div>
        </section>

        <!-- ===== Done ===== -->
        <section class="done" id="doneScreen">
            <div class="check-circle"><i class="fas fa-check"></i></div>
            <h2>Complete!</h2>
            <div class="sub-done" id="doneText"></div>
            <div class="btn-row">
                <button class="btn btn-navy" onclick="restart()">
                    <i class="fas fa-redo"></i> Practice Again
                </button>
            </div>
        </section>

    </div>

<script>
/* =====================================================
   QUESTIONS BANK
   ===================================================== */
const bank = {
    "2025-2026": {
        "9- Urinary Radiology": [
            { q: "Which of the following is used in Vesicouretheal reflux?", a: "Micturating cystourethrogram" },
            { q: "Which modality is used in urethral injury?", a: "Retrograde urethrogram" },
            { q: "Which structure is seen as triangular hypoechoic areas?", a: "Pyramid" },
            { q: "Pt in CT showed deposition of calcium in the renal medulla, this may be due to:", a: "Hyperparathyroidism" },
            { q: "Patient with flank pain, difficulty urination…", a: "Bladder outlet Obstruction", img: "past-2025-2026-urineary-US.png" },
            { q: "In Ultrasound, the kidneys were enlarged and showed multi hypoechoic lesion bilateral?", a: "Autosomal Dominant Polycystic kidney disease" },
            { q: "Case of 3 years child, CT showed patchy enhancement of the lesion, heterogeneous, area of calcification?", a: "Wilms tumor" },
            { q: "A 45-year-old patient presents to the emergency department with severe flank pain radiating to the groin associated with hematuria. Which of the following is the best initial imaging modality to confirm the diagnosis?", a: "CT scan of the abdomen and pelvis (non-contrast)" }

        "10- Male Reproductive Radiology": [
            { q: "Male patient with varicocele, best imaging modality?", a: "US" },
            { q: "In basis of US if patient come with prostatic cancer, finding?", a: "Peripheral zone mass" },
            { q: "A patient presents with acute Right scrotal pain associated with fever and vomiting. On clinical examination, elevation of the testis does not relieve the pain, and scratching the medial aspect of the thigh fails to cause elevation of the testis. Ultrasound is performed shown?", a: "Decreased vascularity in Right testis" },
            { q: "Ectopic testis in the abdomen, best imaging modality?", a: "MRI" },
            { q: "US Show small non shadowing hyperechoic foci in which case?", a: "Testicular microlithiasis" },
            { q: "Male after TRUS performed, there are increased total prostate volume, elevated post micturition residual volume, hydronephrosis diagnosis?", a: "Benign prostatic hyperplasia" }
        ],
        "11- Female Reproductive Radiology": [
            { q: "Post-menopausal female patient with vaginal bleeding, which if the following US finding consider to have endometrial cancer?", a: "Widening of endometrial stripe" },
            { q: "Female After HSG was performed the uterus appears divided with angle more than 105?", a: "Bicornuate uterus" },
            { q: "44 year old obese female with irregular menstruation US show multiple Small anechoic peripheral cysts 'string of pearls'?", a: "Polycystic ovary syndrome" },
            { q: "Which of the following is a Benign ovarian mass feature?", a: "Solid component with no vascularity on Doppler" },
            { q: "Plain film show Tooth component of ovarian mass?", a: "Dermoid cyst" },
            { q: "Female patient with history of tubal pregnancy, amenorrhea, vaginal bleeding & elevated B-hCG. Best initial imaging?", a: "Transvaginal US" },
            { q: "Female patient with amenorrhea, vaginal bleeding & elevated B-hCG. US show multiple cysts within large placenta?", a: "Hydatidiform mole" }
        ],
        "12- Brain & Skull imaging": [
            { q: "Best imaging modality in case of Para nasal sinusitis?", a: "CT" },
            { q: "A CT scan of the brain shows a large posterior fossa with cystic dilatation of the fourth ventricle and absent of the cerebellar vermis. What is the most likely diagnosis?", a: "Dandy–Walker malformation" },
            { q: "Obstruction of aqueduct?", a: "Lateral & third ventricle dilation" },
            { q: "Which of the following appears hyperdense in CT brain?", a: "Recent blood" },
            { q: "Cortical sulci effacement consider as?", a: "Mass effect" },
            { q: "Racing car (parallel of lateral ventricles) appears in which case?", a: "Agenesis of Corpus callosum" },
            { q: "Male patient with repeated headache & seizure?", a: "Meningioma", img: "past-2025-2026-Brain-CT.png" },
            { q: "Female with milky secretion & amenorrhea, infertility… next imaging modality?", a: "MRI sella with contrast" },
            { q: "Patient with optic neuritis, MRI show hyperintense medullary lesions most likely diagnosis?", a: "Multiple sclerosis" },
            { q: "Patient with repeated seizures fever, high white blood cells. After enhance CT performed, ring enhancement with central hypo-density & edema, most likely diagnosis?", a: "Cerebral abscess" },
            { q: "79 year old man with prominent ventricle & sulci. These findings suggest?", a: "Cerebral atrophy" }
        ]
    }
};

/* =====================================================
   FLASHCARDS BANK
   ===================================================== */
const flashcardsBank = {
    "2025-2026": {
        "9- Urinary Radiology": [
            { front: "Why is imaging essential in urology?", back: "Many urinary tract diseases cannot be adequately assessed by physical examination alone." },
            { front: "What are the main imaging modalities used in urinary tract diseases?", back: "KUB X-ray, IVU, cystogram, MCUG/VCUG, ultrasound, CT, MRI, angiography, radionuclide imaging, and retrograde urethrogram." },

            { front: "What is the main role of KUB imaging?", back: "Detection of radiopaque urinary stones." },

            { front: "What is a cystogram?", back: "Imaging study used to evaluate the urinary bladder after filling it with contrast." },
            { front: "What are the main indications for cystography?", back: "Cystitis, trauma, tumors, and congenital anomalies." },
            { front: "How can the bladder be filled for a cystogram?", back: "Via IVU or direct catheterization." },
            { front: "What does MCUG evaluate?", back: "Functional and anatomical abnormalities of the bladder and urethra." },
            { front: "What is the most common pediatric indication for MCUG?", back: "Recurrent urinary tract infections (UTIs)." },
            { front: "Which condition is classically diagnosed by MCUG?", back: "Vesicoureteral reflux (VUR)." },
            { front: "What is vesicoureteral reflux?", back: "Backward flow of urine from the bladder into the ureters and kidneys." },

            { front: "What is the main purpose of a retrograde urethrogram?", back: "Assessment of the urethra." },
            { front: "How is an RGU performed?", back: "Contrast is injected retrogradely into the urethra and radiographs are taken." },

let mode = 'exam'; // 'exam' or 'flash'
let selectedPatch = null;
let selectedLecture = null;

/* ==========================================================
   Utilities
   ========================================================== */
function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function hideAllScreens() {
    document.getElementById('welcomeScreen').style.display = 'none';
    document.getElementById('selectionScreen').classList.remove('visible');
    document.getElementById('examScreen').innerHTML = '';
    document.getElementById('flashScreen').style.display = 'none';
    document.getElementById('doneScreen').classList.remove('visible');
    document.getElementById('topBar').classList.remove('visible');
    document.getElementById('progressTrack').classList.remove('visible');
}

/* ==========================================================
   Selection Screen Logic
   ========================================================== */
function openSelection(type) {
    mode = type;
    hideAllScreens();
    
    selectedPatch = null;
    selectedLecture = null;
    document.getElementById('selectionScreen').classList.add('visible');
    
    if (mode === 'exam') {
        document.getElementById('selectionTitle').textContent = 'Past Questions';
        document.getElementById('selectionSub').textContent = 'Choose patch and lecture, or go random';
        document.getElementById('startExamBtn').style.display = 'inline-flex';
        document.getElementById('startFlashBtn').style.display = 'none';
        document.getElementById('patchGroup').style.display = 'block'; // SHOW PATCH
        renderPatches(bank);
        document.getElementById('lectureGrid').innerHTML = '';
    } else {
        document.getElementById('selectionTitle').textContent = 'Flashcards';
        document.getElementById('selectionSub').textContent = 'Choose a lecture or go random';
        document.getElementById('startExamBtn').style.display = 'none';
        document.getElementById('startFlashBtn').style.display = 'inline-flex';
        document.getElementById('patchGroup').style.display = 'none'; // HIDE PATCH
        
        // Auto-select the first available patch for flashcards behind the scenes
        selectedPatch = Object.keys(flashcardsBank)[0]; 
        renderLectures(flashcardsBank, true); // true = auto-select random
    }
    checkStartBtn();
}

function backToWelcome() {
    hideAllScreens();
    document.getElementById('welcomeScreen').style.display = 'flex';
}

function renderPatches(dataObj) {
    const grid = document.getElementById('patchGrid');
    let html = `
        <label class="chip-btn">
            <input type="radio" name="patch" value="random" onchange="selectPatch('random')">
            <span><i class="fas fa-shuffle" style="margin-right:5px"></i> Random Patch</span>
        </label>
    `;
    Object.keys(dataObj).forEach(patch => {
        html += `
        <label class="chip-btn">
            <input type="radio" name="patch" value="${patch}" onchange="selectPatch('${patch}')">
            <span>${patch}</span>
        </label>`;
    });
    grid.innerHTML = html;
}

function selectPatch(val) {
    selectedPatch = val;
    selectedLecture = null;
    checkStartBtn();
    
    const dataObj = (mode === 'exam') ? bank : flashcardsBank;
    
    if (selectedPatch === 'random') {
        renderLectures(dataObj, true); // Auto-select random lecture
    } else {
        renderLectures({ [selectedPatch]: dataObj[selectedPatch] }, true);
    }
}

function renderLectures(dataObj, autoSelectRandom = false) {
    const grid = document.getElementById('lectureGrid');
    let lectures = new Set();
    
    Object.values(dataObj).forEach(patchObj => {
        if(patchObj) Object.keys(patchObj).forEach(l => lectures.add(l));
    });
    
    let html = `
        <label class="chip-btn">
            <input type="radio" name="lecture" value="random" onchange="selectLecture('random')" ${autoSelectRandom ? 'checked' : ''}>
            <span><i class="fas fa-shuffle" style="margin-right:5px"></i> All (Random)</span>
        </label>
    `;
    
    lectures.forEach(lec => {
        html += `
        <label class="chip-btn">
            <input type="radio" name="lecture" value="${lec}" onchange="selectLecture('${lec}')">
            <span>${lec}</span>
        </label>`;
    });
    
    grid.innerHTML = html;

    // Auto-select random if triggered from flash or patch change
    if (autoSelectRandom) {
        selectLecture('random');
    }
}

function selectLecture(val) {
    selectedLecture = val;
    checkStartBtn();
}

function checkStartBtn() {
    const btn = document.getElementById(mode === 'exam' ? 'startExamBtn' : 'startFlashBtn');
    if (mode === 'exam') {
        btn.disabled = !(selectedPatch && selectedLecture);
    } else {
        btn.disabled = !selectedLecture; // Patch is auto-selected for flashcards
    }
}

/* ==========================================================
   Exam Logic
   ===================================================== */
function startPractice() {
    currentQuestions = [];
    gatherData(bank);
    
    if (currentQuestions.length === 0) return;
    currentQuestions = shuffle(currentQuestions);
    idx = 0;
    answeredSet = new Set();

    hideAllScreens();
    document.getElementById('topBar').classList.add('visible');
    document.getElementById('progressTrack').classList.add('visible');
    renderQuestion();
}

        targetPatches = [selectedPatch];
    }

    targetPatches.forEach(patch => {
        if (!dataObj[patch]) return;
        if (selectedLecture === 'random') {
            Object.keys(dataObj[patch]).forEach(lec => {
                if (dataObj[patch][lec]) {
                    dataObj[patch][lec].forEach(q => currentQuestions.push({ ...q, lecture: lec }));
                }
            });
        } else {
            const qs = dataObj[patch][selectedLecture] || [];
            qs.forEach(q => currentQuestions.push({ ...q, lecture: selectedLecture }));
        }
    });
}

function renderQuestion() {
    const totalQ = currentQuestions.length;
    const qData = currentQuestions[idx];
    const remaining = totalQ - idx;
    const isAnswered = answeredSet.has(idx);

    document.getElementById('remainCount').textContent = 'Remaining: ' + remaining;
    document.getElementById('progressFill').style.width = ((idx / totalQ) * 100) + '%';

    const revealedClass = isAnswered ? ' revealed' : '';
    const answerDisplay = isAnswered ? ' style="display:block"' : '';
    const isFirst = idx === 0;
    const isLast = idx >= totalQ - 1;
    const nextLabel = isLast ? 'Finish' : 'Next';
    const nextIcon = isLast ? 'fa-flag-checkered' : 'fa-arrow-right';

    let imgHtml = '';
    if (qData.img) {
        imgHtml = `<div class="q-img"><img src="${qData.img}" alt="Question Image" onerror="this.parentElement.style.display='none'"></div>`;
    }

    document.getElementById('examScreen').innerHTML = `
    <div class="q-card">
        <div class="q-body">
            <div class="lecture-tag"><i class="fas fa-book" style="margin-right:5px"></i>${qData.lecture}</div>
            <div class="q-item${revealedClass}" id="qi0">
                <div class="q-text">${qData.q}</div>
                ${imgHtml}
                <div class="a-text"${answerDisplay}><i class="fas fa-check-circle" style="margin-right:5px"></i>${qData.a}</div>
            </div>
        </div>
        <div class="actions">
            <button class="btn btn-outline btn-sm" onclick="goPrev()"${isFirst ? ' disabled' : ''}>
                <i class="fas fa-arrow-left"></i> Previous
            </button>

            ${isAnswered ? '' : `
                <button class="btn btn-navy btn-sm" id="btnReveal" onclick="revealAnswer()">
                    <i class="fas fa-eye"></i> Show Answer
                </button>
            `}

            <button class="btn btn-green btn-sm" id="btnNext" onclick="goNext()"${isAnswered ? '' : ' style="display:none"'}>
                ${nextLabel} <i class="fas ${nextIcon}"></i>
            </button>
        </div>
    </div>`;
}

function revealAnswer() {
    answeredSet.add(idx);
    document.getElementById('qi0').classList.add('revealed');
    document.querySelector('.a-text').style.display = 'block';
    document.getElementById('btnReveal').remove();
    document.getElementById('btnNext').style.display = 'inline-flex';
}

function goNext() {
    idx++;
    if (idx >= currentQuestions.length) showDone();
    else renderQuestion();
}

function goPrev() {
    if (idx > 0) { idx--; renderQuestion(); }
}

/* ==========================================================
   Flashcards Logic
   ========================================================== */
function startFlashcards() {
    currentFlashcards = [];
    fcWrongList = [];
    gatherData(flashcardsBank);
    
    if (currentFlashcards.length === 0) return;
    currentFlashcards = shuffle(currentFlashcards);
    fcIdx = 0;

    hideAllScreens();
    document.getElementById('topBar').classList.add('visible');
    document.getElementById('progressTrack').classList.add('visible');
    document.getElementById('flashScreen').style.display = 'block';
    
    renderFlashcard();
}

function renderFlashcard() {
    const totalQ = currentFlashcards.length;
    const fcData = currentFlashcards[fcIdx];
    const remaining = totalQ - fcIdx;

    document.getElementById('remainCount').textContent = 'Remaining: ' + remaining;
    document.getElementById('progressFill').style.width = ((fcIdx / totalQ) * 100) + '%';
    
    document.getElementById('flashFrontText').innerHTML = `<div style="margin-bottom:10px; font-size:12px; color:var(--muted); font-weight:700;">${fcData.lecture}</div>` + fcData.front;
    document.getElementById('flashBackText').innerHTML = fcData.back;
    document.getElementById('flashCounter').textContent = (fcIdx + 1) + ' / ' + totalQ;

    // Reset flip and buttons
    document.getElementById('flashInner').classList.remove('flipped');
    document.getElementById('fcBtns').style.display = 'none';
}

function flipCard() {
    const inner = document.getElementById('flashInner');
    inner.classList.toggle('flipped');
    
    // Show Correct/Incorrect buttons only when flipped to back
    const isFlipped = inner.classList.contains('flipped');
    document.getElementById('fcBtns').style.display = isFlipped ? 'flex' : 'none';
}

function markFlashcard(isCorrect) {
    if (!isCorrect) {
        fcWrongList.push(currentFlashcards[fcIdx]);
    }
    nextFlashcard();
}

function nextFlashcard() {
    if (fcIdx < currentFlashcards.length - 1) {
        fcIdx++;
        renderFlashcard();
    } else {
        // End of current deck
        if (fcWrongList.length > 0) {
            // Review incorrect cards
            currentFlashcards = shuffle(fcWrongList);
            fcWrongList = []; // Reset wrong list for the new loop
            fcIdx = 0;
            renderFlashcard();
        } else {
            showDone();
        }
    }
}

function prevFlashcard() {
    if (fcIdx > 0) {
        fcIdx--;
        renderFlashcard();
    }
}

function shuffleFlashcards() {
    currentFlashcards = shuffle(currentFlashcards);
    fcIdx = 0;
    renderFlashcard();
}

function backToWelcomeFromFlash() {
    hideAllScreens();
    document.getElementById('welcomeScreen').style.display = 'flex';
}

/* ==========================================================
   Done Screen
   ========================================================== */
function showDone() {
    hideAllScreens();
    document.getElementById('doneText').textContent = mode === 'exam' ? 
        `You reviewed ${currentQuestions.length} questions.` : 
        `You mastered all ${currentFlashcards.length} flashcards!`;
    document.getElementById('doneScreen').classList.add('visible');
}

function restart() {
    backToWelcome();
}

</script>
